server:
  port: ${PORT:8080}

spring:
  application:
    name: secure-cloud-file-storage
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  jackson:
    serialization:
      fail-on-empty-beans: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
            required: true
          connectiontimeout: 7000
          timeout: 7000
          writetimeout: 7000

# App Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  storage:
    type: ${APP_STORAGE_TYPE:filesystem}
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:./storage_uploads}
    default-quota-bytes: ${APP_DEFAULT_QUOTA_BYTES:524288000} # 500 MB default quota per user (FR-18)
  frontend-url: ${APP_FRONTEND_URL:https://cloud-based-file-storage-system-delta.vercel.app}
  mail:
    from: ${APP_MAIL_FROM:noreply@cloudvault.app}
    sender-name: ${APP_MAIL_SENDER_NAME:CloudVault Security}
    otp-expiration-minutes: 15
    resend-cooldown-seconds: 60

---
# Local Development Profile (Embedded H2 Database)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/fileserver;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  storage:
    type: filesystem

---
# Cloud Production Profile (Supabase / Render PostgreSQL)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/fileserver_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 15000
      idle-timeout: 300000
      max-lifetime: 1800000
      data-source-properties:
        connectTimeout: 10
        socketTimeout: 30
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  storage:
    type: ${APP_STORAGE_TYPE:database}

---
# Swagger / OpenAPI Documentation (FR-19)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
